# API Keys - Set via environment variables (HF_API_KEY, TOGETHER_AI_API_KEY, OPENAI_API_KEY)

# Default experiment name
experiment: 'default_experiment_name'

# Project-wide RNG (Python / NumPy / PyTorch; training; OpenAI & HF generation where supported).
# Override at runtime with SEED=<int>.
seed: 42

# Question-answer creation prompts
system_prompt: >
  You are an expert in Aerospace Engineering and you are tasked to read text and create questions for this text.
query_prompt: >
  # Please create a question for the following text: {text}.
  # Adhere to the following rules:
  - make sure to include context in the question,
  - make the text used to create the question has an answer to the created question,
  - don't specify the answer in your response,
  - if text is all in capital letters and consists of not more than 8 words, it is most likely a title, 
  - here is list of previously created questions:
  {questions}, make sure the new question differs from the previous ones.
  
  # Return only the created question.

# AI expert evaluation prompt
ai_expert_prompt: >
  You are an expert in Aerospace Engineering and you are tasked to read two texts and make a verdict if the second
  text is similar enough to be considered the same.
query_expert_prompt: >
  # Please read the following 2 texts:
  - {text_1}
  - {text_2}
  # Please evaluate how similar the second text is to the first one.
  # Please return "1" if similar and "0" if not. Don't ever return anything else but these two binary ints: 1 or 0!

# Inference prompts
inference_prompt: You are an excellent assistant in Aerospace Engineering!

# Rag prompt
rag_prompt: >
  Please provide an answer to the following query based on the provide context. Don't change the original text,
  unless it is required to adjust numbers (rivet sizes, diameters, etc.)

# Paths
paths:
  experiments: 'experiments'
  answers: 'answers'
  question_answer: 'question_answer'
  checkpoints: 'checkpoints'
  downloaded_models: 'downloaded_models'
  models:
    3_2_1b: 'downloaded_3_2_1b'
    3_1_8b: 'downloaded_3_1_8b'
    qwen_3b: 'downloaded_qwen2_5_3b'
    jina_embeddings: 'jina-v2-base-en'
  split_by_title: 'question_answer/split_by_title'
  charts: 'experiments/charts'
  paper_assets: 'paper_assets'   # copy-paste-ready LaTeX tables + figures (--paper_assets)

# Files
files:
  qa_original: 'question_answer/qa_original.json'
  qa_inflating_material: 'question_answer/inflating_material.json'
  qa: 'question_answer/qa.json'
  qa_train: 'question_answer/qa_train.json'
  qa_test: 'question_answer/qa_test.json'
  qa_scalability: 'question_answer/qa_scalability.json'   # scalability sweep (#5): fixed 100-question / 4-core-expert subset of qa_test (built by question_answer/build_scalability_subset.py); the other 8 real experts are used as distractors. Point at a larger synthetic set only to scale the pool past 12.
  srm_pdf: 'question_answer/srm.pdf'
  om_pdf: 'question_answer/om.pdf'
  mm_pdf: 'question_answer/mm.pdf'
  metrics: 'metrics.json'

# Logging
logging:
  log_dir: 'logs'

# Models
models:
  gpt_4_1: "gpt-4.1-2025-04-14"
  embedding_model: "text-embedding-3-small"
  gpt_4_1_nano: "gpt-4.1-nano-2025-04-14"
  3_2_1b: "meta-llama/Llama-3.2-1B-Instruct"
  3_1_8b: "meta-llama/Llama-3.1-8B-Instruct"
  3_3_70b: "meta-llama/Llama-3.3-70B-Instruct"
  qwen_3b: "Qwen/Qwen2.5-3B-Instruct"
  task_categorizer: "meta-llama/Llama-3.1-8B-Instruct"

# Training hyperparameters
# Tuned to standard LoRA instruction-SFT practice to avoid the over-fitting that
# drove greedy-decode repetition collapse. Three values changed from the old
# aggressive setup; everything else (batch sizes, LoRA rank/alpha/dropout,
# weight decay, warmup, grad clip) is unchanged:
#   num_epochs 30 -> 10           (30 memorises the data and degenerates; 10 is a
#                                  safe cap, and early_stopping_patience=3 +
#                                  load_best_model_at_end stop it sooner if the
#                                  eval loss plateaus)
#   learning_rate 1e-3 -> 2e-4    (the canonical LoRA LR, e.g. QLoRA)
#   label_smoothing 0.01 -> 0     (standard SFT uses none; smoothing flattens the
#                                  output distribution and worsens greedy repetition)
training:
  num_epochs: 10
  learning_rate: 0.0002
  label_smoothing_factor: 0.0
  weight_decay: 0.001
  warmup_ratio: 0.05
  # Per-device batch sizes are model-size-aware (see finetune.py): the 1B
  # experts fit a large batch on an 80GB GPU, the 8B baseline fills memory much
  # faster so it takes a smaller one. gradient_accumulation_steps=1 means the
  # effective batch == per_device batch. NOTE: this enlarges the effective
  # batch vs. the old 2x2=4, so it changes optimisation slightly over the fixed
  # 30 epochs — consider linear-scaling the LR if you want to match old runs.
  per_device_train_batch_size: 8       # 1B experts
  per_device_eval_batch_size: 8        # 1B experts
  per_device_train_batch_size_3b: 8    # 3B experts (Qwen-3B) — mid-size
  per_device_eval_batch_size_3b: 8     # 3B experts
  per_device_train_batch_size_8b: 4    # 8B baseline (fills 80GB sooner)
  per_device_eval_batch_size_8b: 4     # 8B baseline
  gradient_accumulation_steps: 1
  max_grad_norm: 1
  logging_steps: 50
  save_total_limit: 4
  early_stopping_patience: 3
  
  # LoRA parameters
  lora:
    alpha: 128
    dropout: 0.05
    r: 16

# Data processing constants
data:
  test_split_ratio: 0.20
  max_length: 1024
  num_questions_per_text: 28
  prefix_length: 5

# RAG/Embedding constants
rag:
  embedding_dimension: 1536
  chunk_size: 500
  chunk_overlap: 50
  batch_size: 100
  k_retrievals: 5

# SLG router configuration
slg:
  slg_dir: "slg"                    # adapter subdirectory under experiments/<exp>/
  descriptions_dir: "slg_descriptions"  # where descriptions.json is stored (experiment-agnostic)
  max_description_words: 10
  out_of_scope_token: "NONE"
  # Which downloaded model plays each role (keys of paths.models). Experts +
  # reasoner (router tiebreak / aggregate / compress) are Qwen-3B; the critic is
  # a *different family* (Llama-3.1-8B, >= experts) to avoid the "model grading
  # its own family" self-preference objection. The router classifier is always
  # Llama-1B (inference/slg/classifier.py) and is not configured here.
  expert_model: 'qwen_3b'           # base model for the per-topic LoRA experts
  reasoner_model: 'qwen_3b'         # router tiebreaker + aggregator + compressor
  critic_model: '3_1_8b'            # (B) domain verifier critic

# Routing pipeline: cosine pre-filter -> reasoning router -> domain verifier -> reroute -> aggregate -> compress
# Three online mechanisms learn across one run/session: (A) competence router,
# (B) domain verifier, (C) calibrated abstention.
routing:
  top_k_cosine: 5                       # Jina cosine shortlist size (retriever fallback + reasoner-tiebreak candidate list)
  max_reroutes: 3                       # verifier-reject reroute attempts before giving up on a question

  # Router: a Llama-3.2-1B sequence-classification head is the routing *decider*.
  # Diagnostics showed the 8B reasoning router degraded routing from ~85% (cosine
  # top-1) to ~45% by second-guessing a good shortlist; the discriminative
  # classifier restores accuracy and the Qwen-3B reasoner is kept ONLY as a tiebreaker
  # for genuinely ambiguous questions. Trained by --finetune_router (one classifier
  # over the full expert set), cached at experiments/<exp>/slg_router/; the allowed
  # pool is applied as an output mask at query time, so the scalability sweep reuses
  # one router across pool sizes with no retraining (same pattern as the retriever).
  # If no trained router exists the pipeline falls back to cosine top-1 (retriever).
  router:
    train_per_class: 400                # training questions sampled per expert (seeded subset of qa_train)
    max_length: 256                     # question truncation length for the classifier
    num_epochs: 3
    learning_rate: 0.0002
    batch_size: 16                      # per-device batch for classifier fine-tuning + inference forward passes
    tie_margin: 0.15                    # run the Qwen-3B reasoner tiebreaker when the top1-top2 score gap < this
    prob_floor: 0.10                    # classifier only: reject ("no suitable expert") when the top *probability* (softmax over the candidate set) is below this
    cosine_floor: 0.0                   # cosine-fallback only: reject when the top raw cosine is below this (0.0 => effectively cosine top-1, no rejection). Not comparable to prob_floor.
    multi_threshold: 0.30               # interactive only: also select experts scoring >= this (multi-expert turns)
  scalability_sizes: [4, 6, 8, 10, 12]  # total pool sizes for the scalability sweep (#5): 4 = core only, up to 12 = core + all 8 real distractors. (Add larger sizes only with a synthetic distractor set.)
  interactive_multi_expert: true        # interactive chat may pick >1 expert; batch inference always forces 1
  embedding_dimension: 768              # jina-v2-base-en
  embedding_batch_size: 100             # batch size when embedding expert training answers
  compression_max_tokens: 256           # token budget for the compressed answer carried across chat turns

  # (A) Online competence-learning router — every verifier verdict updates a
  # per-expert, per-query-region reliability estimate that signs the cosine rank.
  competence_similarity_threshold: 0.85 # a question is "in the same region" at >= this cosine
  competence_weight: 0.3                # scale of the cosine adjustment per unit of reliability above/below the prior

  # (B) Domain-grounded verifier
  verifier_require_units: true          # flag quantitative answers that omit units on their numbers

  # (C) Calibrated abstention — self-supervised confidence threshold over verifier confidence
  abstention_target_error: 0.10         # max tolerated error rate among accepted answers
  abstention_confidence_floor: 0.5      # threshold used until min_calibration observations accrue
  abstention_min_calibration: 20        # observations needed before the calibrated threshold is trusted

  # Sentinels returned to the user / written to predictions
  rejection_message: "A suitable expert was not found for your question."
  exhausted_message: "The experts were not able to answer your question."
  low_confidence_message: "No expert could answer this with sufficient confidence."

# Generation constants
generation:
  max_new_tokens: 750
  temperature: 0.1
  # Anti-repetition guards for greedy decoding (do_sample=False). Small fine-tuned
  # LLaMA experts otherwise collapse into looping text that the critic rejects.
  # repetition_penalty >1 discourages reusing recent tokens; no_repeat_ngram_size
  # hard-bans repeating any n-gram of this length. 1.0 / 0 disable them.
  repetition_penalty: 1.3
  no_repeat_ngram_size: 3
  # Batched inference — how many prompts are decoded together per GPU. Greedy
  # decoding, so answers match the one-at-a-time path in practice (only padding
  # + float order differ). Sized to load an 80GB GPU toward ~75% without OOM;
  # raise/lower after watching `nvidia-smi` on the first run.
  reasoner_batch_size: 12   # 8B critic — ~16GB weights + long critic prompts
                            #   (question + up to 750-token answer), so kept
                            #   small; the 8B fills memory fast. Also bounds the
                            #   Qwen-3B reasoner-tiebreak batch (fits easily).
  expert_batch_size: 24     # 3B experts (Qwen-3B) — ~6GB weights; smaller batch
                            #   than the old 1B experts. Lower if you OOM, raise
                            #   after watching nvidia-smi on the first run.

# Evaluation: save resume checkpoints every N test questions (row-wise); see experiments/<exp>/evaluation_checkpoints/
evaluation:
  checkpoint_every: 10

# Adapter names
adapters:
  finetuned_3_2_1b: 'finetuned_3_2_1b'
  finetuned_3_1_8b: 'finetuned_3_1_8b'

# Training components configuration
# Controls which models/components to train
training_components:
  train_slg_system: true            # Train SLG experts (routing: prompt-based SLM + descriptions.json)
  train_3_2_1b: false               # Train baseline 3_2_1b model
  train_3_1_8b: false                 # Train baseline 3_1_8b model
