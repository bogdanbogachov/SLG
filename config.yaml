# API Keys - Set via environment variables (HF_API_KEY, TOGETHER_AI_API_KEY, OPENAI_API_KEY)

# Default experiment name
experiment: 'default_experiment_name'

# Project-wide RNG (Python / NumPy / PyTorch; training; OpenAI & HF generation where supported).
# Override at runtime with SEED=<int>.
seed: 42

# Question-answer creation prompts
system_prompt: >
  You are an expert in Aerospace Engineering and you are tasked to read text and create questions for this text.
query_prompt: >
  # Please create a question for the following text: {text}.
  # Adhere to the following rules:
  - make sure to include context in the question,
  - make the text used to create the question has an answer to the created question,
  - don't specify the answer in your response,
  - if text is all in capital letters and consists of not more than 8 words, it is most likely a title, 
  - here is list of previously created questions:
  {questions}, make sure the new question differs from the previous ones.
  
  # Return only the created question.

# AI expert evaluation prompt
ai_expert_prompt: >
  You are an expert in Aerospace Engineering and you are tasked to read two texts and make a verdict if the second
  text is similar enough to be considered the same.
query_expert_prompt: >
  # Please read the following 2 texts:
  - {text_1}
  - {text_2}
  # Please evaluate how similar the second text is to the first one.
  # Please return "1" if similar and "0" if not. Don't ever return anything else but these two binary ints: 1 or 0!

# Inference prompts
inference_prompt: You are an excellent assistant in Aerospace Engineering!

# Rag prompt
rag_prompt: >
  Please provide an answer to the following query based on the provide context. Don't change the original text,
  unless it is required to adjust numbers (rivet sizes, diameters, etc.)

# Paths
paths:
  experiments: 'experiments'
  answers: 'answers'
  question_answer: 'question_answer'
  checkpoints: 'checkpoints'
  downloaded_models: 'downloaded_models'
  models:
    3_2_1b: 'downloaded_3_2_1b'
    3_1_8b: 'downloaded_3_1_8b'
    jina_embeddings: 'jina-v2-base-en'
  split_by_title: 'question_answer/split_by_title'
  charts: 'experiments/charts'

# Files
files:
  qa_original: 'question_answer/qa_original.json'
  qa_inflating_material: 'question_answer/inflating_material.json'
  qa: 'question_answer/qa.json'
  qa_train: 'question_answer/qa_train.json'
  qa_test: 'question_answer/qa_test.json'
  qa_scalability: 'question_answer/qa_test.json'   # synthetic set for the scalability sweep (#5); point at the large synthetic QA file
  srm_pdf: 'question_answer/srm.pdf'
  om_pdf: 'question_answer/om.pdf'
  mm_pdf: 'question_answer/mm.pdf'
  metrics: 'metrics.json'

# Logging
logging:
  log_dir: 'logs'

# Models
models:
  gpt_4_1: "gpt-4.1-2025-04-14"
  embedding_model: "text-embedding-3-small"
  gpt_4_1_nano: "gpt-4.1-nano-2025-04-14"
  3_2_1b: "meta-llama/Llama-3.2-1B-Instruct"
  3_1_8b: "meta-llama/Llama-3.1-8B-Instruct"
  3_3_70b: "meta-llama/Llama-3.3-70B-Instruct"
  task_categorizer: "meta-llama/Llama-3.1-8B-Instruct"

# Training hyperparameters
training:
  num_epochs: 10
  learning_rate: 0.001
  label_smoothing_factor: 0.01
  weight_decay: 0.001
  warmup_ratio: 0.05
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 2
  max_grad_norm: 1
  logging_steps: 50
  save_total_limit: 4
  early_stopping_patience: 3
  
  # LoRA parameters
  lora:
    alpha: 128
    dropout: 0.05
    r: 16

# Data processing constants
data:
  test_split_ratio: 0.20
  max_length: 1024
  num_questions_per_text: 28
  prefix_length: 5

# RAG/Embedding constants
rag:
  embedding_dimension: 1536
  chunk_size: 500
  chunk_overlap: 50
  batch_size: 100
  k_retrievals: 5

# SLG router configuration
slg:
  slg_dir: "slg"                    # adapter subdirectory under experiments/<exp>/
  descriptions_dir: "slg_descriptions"  # where descriptions.json is stored (experiment-agnostic)
  max_description_words: 10
  out_of_scope_token: "NONE"

# Routing pipeline: cosine pre-filter -> reasoning router -> domain verifier -> reroute -> aggregate -> compress
# Three online mechanisms learn across one run/session: (A) competence router,
# (B) domain verifier, (C) calibrated abstention.
routing:
  top_k_cosine: 5                       # Jina cosine shortlist size handed to the reasoning router
  max_reroutes: 3                       # verifier-reject reroute attempts before giving up on a question
  scalability_sizes: [5, 10, 20]        # total pool sizes (core + distractor experts) for the scalability sweep (#5, synthetic data)
  interactive_multi_expert: true        # interactive chat may pick >1 expert; batch inference always forces 1
  embedding_dimension: 768              # jina-v2-base-en
  embedding_batch_size: 100             # batch size when embedding expert training answers
  compression_max_tokens: 256           # token budget for the compressed answer carried across chat turns

  # (A) Online competence-learning router — every verifier verdict updates a
  # per-expert, per-query-region reliability estimate that signs the cosine rank.
  competence_similarity_threshold: 0.85 # a question is "in the same region" at >= this cosine
  competence_weight: 0.3                # scale of the cosine adjustment per unit of reliability above/below the prior

  # (B) Domain-grounded verifier
  verifier_require_units: true          # flag quantitative answers that omit units on their numbers

  # (C) Calibrated abstention — self-supervised confidence threshold over verifier confidence
  abstention_target_error: 0.10         # max tolerated error rate among accepted answers
  abstention_confidence_floor: 0.5      # threshold used until min_calibration observations accrue
  abstention_min_calibration: 20        # observations needed before the calibrated threshold is trusted

  # Sentinels returned to the user / written to predictions
  rejection_message: "A suitable expert was not found for your question."
  exhausted_message: "The experts were not able to answer your question."
  low_confidence_message: "No expert could answer this with sufficient confidence."

# Generation constants
generation:
  max_new_tokens: 750
  temperature: 0.1

# Evaluation: save resume checkpoints every N test questions (row-wise); see experiments/<exp>/evaluation_checkpoints/
evaluation:
  checkpoint_every: 10

# Adapter names
adapters:
  finetuned_3_2_1b: 'finetuned_3_2_1b'
  finetuned_3_1_8b: 'finetuned_3_1_8b'

# Training components configuration
# Controls which models/components to train
training_components:
  train_slg_system: true            # Train SLG experts (routing: prompt-based SLM + descriptions.json)
  train_3_2_1b: true               # Train baseline 3_2_1b model
  train_3_1_8b: true                 # Train baseline 3_1_8b model
